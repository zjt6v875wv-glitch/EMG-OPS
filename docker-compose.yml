# Local development stack. Secrets come from .env (never committed).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-emg}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emg}"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-emg}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes: [objects:/data]
    ports: ["9000:9000", "9001:9001"]

  api:
    build: { context: ., dockerfile: engine/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-emg}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-emg}
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]

  worker:
    build: { context: ., dockerfile: engine/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-emg}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-emg}
    command: ["python", "-m", "emg.services.jobs"]
    depends_on: { db: { condition: service_healthy } }

  web:
    build: { context: apps/web }
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  objects:
