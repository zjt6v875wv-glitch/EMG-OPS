[project]
name = "emg-ops-engine"
version = "0.1.0"
description = "EMG commission payroll engine, services and API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2",
  "openpyxl>=3.1",
  "bcrypt>=4.1",
  "reportlab>=4.2",
  "pdfplumber>=0.11",
  "pypdf>=4.3",
  "pillow>=10",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["emg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
